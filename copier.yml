# ========== // PROJECT BASICS // ==========

project_name:
  type: str
  help: What is the name of the project?

project_slug:
  type: str
  help: Project slug (used for package name import)
  default: "{{ project_name.lower().replace(' ', '_').replace('-', '_') }}"
  validator: "{% if not project_slug.isidentifier() %}Must be a valid Python identifier (letters, digits, underscores){% endif %}"

package_name:
  type: str
  help: What is the name of the repository and pypi package?
  default: "{{ project_slug.replace('_', '-') }}"

project_description:
  type: str
  help: How would you describe this project? What is a one-liner to describe it?

project_author:
  type: str
  help: Who is the primary author of this project?

github_username:
  type: str
  help: What is your GitHub username?
  default: "Johandielangman"

contact_email:
  type: str
  help: What is your contact email?
  default: "johan@datatreehouse.org"


# =============== // PACKAGE DETAILS // ===============

python_versions:
  type: str
  help: Multi select the supported versions of python
  multiselect: true
  validator: "{% if not python_versions %}Select at least one Python version{% endif %}"
  choices:
    - "3.9"
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.15"

project_python_version:
  type: str
  help: Select the Python version for this project
  choices: "{{ python_versions }}"
  default: "{{ python_versions[-1] }}"

supported_operating_systems:
  type: str
  help: Select the supported operating systems for this project
  multiselect: true
  default: ["Windows", "macOS", "Linux"]
  validator: "{% if not supported_operating_systems %}Select at least one operating system{% endif %}"
  choices:
    - "Windows"
    - "macOS"
    - "Linux"


# ========== // SETTINGS // ==========

_subdirectory: "template"

_skip_if_exists:
  - "src/"
  - "docs/"
  - "tests/"
  - "pyproject.toml"

_message_after_copy: |
  Your project "{{ project_name }}" has been created successfully!

  Please remember:
  1. Run `uv lock` and commit `uv.lock` (CI runs with --locked and fails without it)
  2. Add a `CODECOV_TOKEN` token to the secrets
  3. Go to Settings > Pages and set to Deploy from branch. It will be `gh-pages`
  4. On PyPI, add a trusted publisher for {{ github_username }}/{{ package_name }}
     with workflow `release.yml` and environment `pypi`

  If you ever want to update the template, run `copier update`
